# Host nginx for myserviceuz.uz (docker-compose.prod.yml publishes the containers on 127.0.0.1).
# Certificates: certbot --nginx -d myserviceuz.uz -d files.myserviceuz.uz

server {
  listen 80;
  server_name myserviceuz.uz files.myserviceuz.uz;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name myserviceuz.uz;

  ssl_certificate /etc/letsencrypt/live/myserviceuz.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/myserviceuz.uz/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so clients cannot inject a fake client IP; the API trusts one hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Photo uploads: browsers PUT to presigned URLs here (S3_PUBLIC_ENDPOINT=https://files.myserviceuz.uz).
server {
  listen 443 ssl http2;
  server_name files.myserviceuz.uz;

  ssl_certificate /etc/letsencrypt/live/myserviceuz.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/myserviceuz.uz/privkey.pem;
  client_max_body_size 12m;

  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    # The presigned signature covers the Host header; pass it through unchanged.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
  }
}
