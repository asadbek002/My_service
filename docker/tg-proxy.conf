# Relay for the Telegram Bot API, running in the host's network (see docker-compose.prod.yml).
# Some servers reach api.telegram.org from the host but not from Docker containers; the API
# container sends its Telegram calls here and nginx forwards them from the host.
server {
    listen 8089;
    # Only the machine itself and Docker networks; everyone else gets 403.
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    access_log off;
    client_max_body_size 10m;

    location / {
        proxy_pass https://api.telegram.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # getUpdates long polling holds the request up to 25 s.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
