services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: myservice
      POSTGRES_USER: myservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myservice -d myservice"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Telegram calls go through tg-proxy (host network). Set TELEGRAM_API_BASE=https://api.telegram.org/
      # in .env to talk to Telegram directly when the container can reach it.
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-http://host.docker.internal:8089/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3004:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Forwards the API's Telegram Bot API calls from the host's network (docker/tg-proxy.conf).
  tg-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/tg-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
