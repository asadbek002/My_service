services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: myservice
      POSTGRES_USER: myservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Loopback only: the API runs in the host network (see api below).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myservice -d myservice"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Host network: outbound calls (Telegram, SMS) leave exactly like the server's own, which
    # matters on hosts where container traffic to Telegram times out. Listens on 127.0.0.1:3004.
    network_mode: host
    environment:
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      PORT: "3004"
      API_HOST: 127.0.0.1
    # DATABASE_URL / REDIS_URL may keep the service names: they point at the loopback ports above.
    extra_hosts:
      - "postgres:127.0.0.1"
      - "redis:127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
