# App Store app (Capacitor, mobile/ios): myserviceuz.uz with native camera, printing, share sheet and
# push notifications. Built on GitHub's macOS machines, so no Mac is needed.
#
# Run it from GitHub: Actions → "iOS (App Store)" → Run workflow.
#  - Every run builds for the iPhone simulator, opens the app there and checks it starts and shows the
#    site (screenshot in the log and in the "ios-simulator" artifact).
#  - With "TestFlight" ticked it also builds the signed release and uploads it to App Store Connect,
#    where it appears under TestFlight in ~15 minutes and can then be sent for review.
#
# Signing is done by Xcode with an App Store Connect API key (no certificates to manage). Repository
# secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       Apple Developer → Membership details → Team ID (10 characters)
#   ASC_KEY_ID          App Store Connect → Users and Access → Integrations → App Store Connect API → key ID
#   ASC_ISSUER_ID       the "Issuer ID" shown above the keys on the same page
#   ASC_KEY_P8          the downloaded AuthKey_XXXX.p8 file's contents (or base64 of it); the key's role: Admin
name: iOS (App Store)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiya (masalan 1.0.1). Bo'sh qolsa: 1.0.0"
        required: false
        default: ''
      testflight:
        description: "Imzolab App Store Connect'ga (TestFlight) yuklash"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Xcode
        run: |
          # The newest released Xcode (the App Store refuses builds made with a beta).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc' | sort -V | tail -1)"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios
      - name: Capacitor
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          ls build/Build/Products/Debug-iphonesimulator/App.app
          /usr/libexec/PlistBuddy -c 'Print' build/Build/Products/Debug-iphonesimulator/App.app/Info.plist | head -60
      - name: Open the app in the simulator
        run: |
          set -x
          # An iPhone on the newest iOS the machine has.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          runtimes = sorted((r for r in d if 'iOS' in r), key=lambda r: [int(x) for x in r.split('iOS-')[-1].split('-')])
          for r in reversed(runtimes):
              phones = [x for x in d[r] if x['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid']); break")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl spawn "$DEVICE" log stream --level debug --predicate 'process == "App"' > app.log 2>&1 &
          xcrun simctl launch "$DEVICE" uz.myserviceuz.app
          sleep 30
          xcrun simctl io "$DEVICE" screenshot screen.png
          # Still running (a crash on start would have ended it)?
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q uz.myserviceuz.app || { echo "::error::The app is not running"; tail -100 app.log; exit 1; }
          echo "--- app log (filtered) ---"
          grep -iE "error|fault|crash|capacitor|⚡️|WebView|app-bound|To Native" app.log | grep -viE "BackgroundTask|RBS" | tail -60 || true
          # A small copy of the screenshot right in the log.
          sips -Z 480 -s format jpeg -s formatOptions 60 screen.png --out small.jpg >/dev/null
          echo "SCREENSHOT_BASE64_BEGIN"; base64 -i small.jpg; echo "SCREENSHOT_BASE64_END"
          xcrun simctl terminate "$DEVICE" uz.myserviceuz.app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            mobile/ios/screen.png
            mobile/ios/app.log
          retention-days: 7

  testflight:
    if: inputs.testflight
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Secrets present?
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::GitHub secrets yo'q:$missing (qarang: mobile/README.md, App Store bo'limi)"; exit 1; fi
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Xcode
        run: |
          # The newest released Xcode (the App Store refuses builds made with a beta).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc' | sort -V | tail -1)"
          xcodebuild -version
      - name: Capacitor
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Archive (signed by Xcode with the API key)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version_name }}
        run: |
          set -o pipefail
          # The build number must grow with every upload: the run number (plus 100, above any build made by hand).
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${VERSION:-1.0.0}" CURRENT_PROJECT_VERSION="$BUILD" \
            archive | tail -40
          echo "Version ${VERSION:-1.0.0} ($BUILD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Uploaded: App Store Connect → TestFlight (processing takes ~15 minutes)." >> "$GITHUB_STEP_SUMMARY"
